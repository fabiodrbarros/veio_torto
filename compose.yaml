name: veio-torto
services:
  website:
    image: veio-torto:local
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      SITE_ORIGIN: ${SITE_ORIGIN:?Defina SITE_ORIGIN em .env.vps com o dominio HTTPS}
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: "1"
      ENABLE_DEMO: "false"
    ports:
      - "127.0.0.1:${VPS_PORT:-3002}:3000"
    volumes:
      - store:/data
    networks:
      tunnel:
        aliases:
          - veio-torto-web
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  store:
    name: veio-torto-data
networks:
  tunnel:
    name: veio-torto-tunnel
    driver: bridge
